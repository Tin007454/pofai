<template id="wish"><div class="photo-frame">🌙💞</div><h2 id="modalTitle">Para Siempre</h2><p>เลือกดาวหนึ่งดวง แล้วเปิดคำอวยพรของปีนี้</p><div class="cards"><button class="fortune" data-card="0" aria-label="เปิดดาวดวงที่หนึ่ง">☾</button><button class="fortune" data-card="1" aria-label="เปิดดาวดวงที่สอง">✧</button><button class="fortune" data-card="2" aria-label="เปิดดาวดวงที่สาม">♡</button></div><p id="fortuneText" aria-live="polite">ดวงไหนกำลังเรียกเธออยู่?</p></template>
<script>
let entered=false,entryProgress=0;
const canvas=document.querySelector('#universe'),ctx=canvas.getContext('2d');let W=0,H=0,D=1,time=0,yaw=0,drag=false,lastX=0,lastT=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
let seed=19;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const stars=Array.from({length:250},()=>({x:rand(),y:rand(),r:rand()*1.1+.2,a:rand(),p:rand()*6.28}));const heart=[];
for(let i=0;i<3600;i++){const u=rand()*Math.PI*2,v=rand()*Math.PI;const x=16*Math.pow(Math.sin(u),3),y=13*Math.cos(u)-5*Math.cos(2*u)-2*Math.cos(3*u)-Math.cos(4*u);const thickness=Math.sin(v);heart.push({x:x*thickness/16,y:(y*thickness+1)/16,z:Math.cos(v)*.33*Math.sin(u)*Math.sin(u),r:.45+rand()*1.1,p:rand()*6.28})}
const disk=Array.from({length:7500},()=>{const r=.15+Math.pow(rand(),.72)*2.8,a=rand()*Math.PI*2;return{r,a:a+r*3.3,arm:Math.floor(rand()*3),s:rand()*.9+.25,j:(rand()-.5)*.09}});
function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.8);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);draw()}
function draw(){if(!W)return;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#030108';ctx.fillRect(0,0,W,H);const reveal=entered?Math.max(.025,entryProgress):1;const zoom=.1+.9*(1-Math.pow(1-reveal,3));const scale=Math.min(W*.32,H*.32)*zoom,cx=W/2,cy=H*.36,base=H*.64;let g=ctx.createRadialGradient(cx,cy,0,cx,cy,scale*2);g.addColorStop(0,'#60215a22');g.addColorStop(.6,'#20103817');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(const s of stars){ctx.fillStyle=`rgba(227,206,255,${(.2+s.a*.5)*(.75+.25*Math.sin(time+s.p))})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.283);ctx.fill()}
ctx.globalCompositeOperation='lighter';
for(const p of disk){const a=p.r*3.5+p.arm*2.094+p.j*5+time*.2,x=Math.cos(a)*p.r,z=Math.sin(a)*p.r;const angle=yaw*.2,xx=x*Math.cos(angle)-z*Math.sin(angle),zz=x*Math.sin(angle)+z*Math.cos(angle);ctx.fillStyle=`hsla(${322+14*Math.sin(p.r*2)},85%,${49+15/p.r}%,${.18+.23*(1-p.r/3)})`;ctx.fillRect(cx+xx*scale,base+(zz*.24+p.j)*scale,p.s,p.s)}
const halo=ctx.createRadialGradient(cx,base,2,cx,base,scale*.25);halo.addColorStop(0,'#fff3ff');halo.addColorStop(.07,'#f0c1ff');halo.addColorStop(.15,'#ff159e90');halo.addColorStop(1,'transparent');ctx.fillStyle=halo;ctx.save();ctx.translate(cx,base);ctx.scale(1,.36);ctx.fillRect(-scale*.3,-scale*.3,scale*.6,scale*.6);ctx.restore();ctx.fillStyle='#030108';ctx.beginPath();ctx.ellipse(cx,base,scale*.08,scale*.025,0,0,6.283);ctx.fill();
const a=yaw+time*.43,ca=Math.cos(a),sa=Math.sin(a),pulse=1+.025*Math.sin(time*2);const pts=heart.map(p=>({x:p.x*ca+p.z*sa,y:p.y,z:-p.x*sa+p.z*ca,r:p.r,p:p.p})).sort((a,b)=>a.z-b.z);
for(const p of pts){const depth=3.6/(3.6-p.z),light=(p.z+1.2)/2.4,x=cx+p.x*scale*.74*depth*pulse,y=cy-p.y*scale*.74*depth*pulse;ctx.fillStyle=`hsla(${322+light*15},${60+light*30}%,${50+light*40}%,${.25+light*.64})`;const r=p.r*(.65+light*.55);ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();if(p.r>1.45&&light>.5){ctx.fillStyle='#ff9cde18';ctx.beginPath();ctx.arc(x,y,r*4,0,6.283);ctx.fill()}}
ctx.globalCompositeOperation='source-over';
// Text and floating keepsakes share the perspective of the galaxy.
const phrases=['HAPPY BIRTHDAY ♥','MI AMOR ETERNO ∞','AMOR DE MI VIDA','ERES MAGIA ✧','TE ADORO','FELIZ CUMPLEAÑOS','PARA SIEMPRE ♡','CELEBRAMOS','OUR LITTLE UNIVERSE','LOVE YOU MORE'];
ctx.textAlign='center';ctx.textBaseline='middle';
for(let i=0;i<phrases.length;i++){const a=i*2.399+time*.075+yaw*.22,r=1.25+(i%3)*.47,z=Math.sin(a)*r,x=Math.cos(a)*r;ctx.save();ctx.translate(cx+x*scale,base+z*scale*.28);ctx.rotate(Math.sin(a)*.1);const fs=Math.max(8,scale*(.035+(z+2.3)*.006));ctx.font=`bold ${fs}px monospace`;ctx.shadowColor='#ff3fbc';ctx.shadowBlur=9;ctx.fillStyle=`rgba(255,166,218,${.5+(z+2.3)*.1})`;ctx.fillText(phrases[i],0,0);ctx.restore()}
for(let i=0;i<13;i++){const a=i*2.4-time*.14+yaw*.2,r=.9+(i%4)*.43,x=cx+Math.cos(a)*r*scale,y=base+Math.sin(a)*r*scale*.29-15-Math.sin(time+i)*8;ctx.save();ctx.translate(x,y);const n=scale*(.014+(Math.sin(a)+1)*.008);ctx.scale(n,n);ctx.beginPath();ctx.moveTo(0,.3);ctx.bezierCurveTo(-1.8,-.8,-.9,-1.8,0,-.8);ctx.bezierCurveTo(.9,-1.8,1.8,-.8,0,.3);ctx.shadowColor='#ff179b';ctx.shadowBlur=18;ctx.fillStyle='#ff66b7';ctx.fill();ctx.restore()}
if(entered&&entryProgress<1){ctx.globalCompositeOperation='lighter';const strength=1-entryProgress;for(let i=0;i<95;i++){const a=i*2.399,r=((i*97+entryProgress*1000)%800)/800*Math.max(W,H);ctx.strokeStyle=`rgba(255,${120+i%100},220,${strength*.65})`;ctx.lineWidth=1+i%2;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.7);ctx.lineTo(cx+Math.cos(a)*(r+strength*70),cy+Math.sin(a)*(r+strength*70)*.7);ctx.stroke()}ctx.globalCompositeOperation='source-over'}
}

function frame(t){const dt=lastT?Math.min((t-lastT)/1000,.05):0;lastT=t;if(entered&&playing&&!drag){time+=dt;entryProgress=Math.min(1,entryProgress+dt/2.4);draw()}requestAnimationFrame(frame)}
canvas.onpointerdown=e=>{drag=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag){yaw+=(e.clientX-lastX)*.008;lastX=e.clientX;draw()}};canvas.onpointerup=canvas.onpointercancel=()=>drag=false;

const motion=document.querySelector('#motion');function sync(){motion.textContent=playing?'Ⅱ หยุดการเคลื่อนไหว':'▷ เล่นการเคลื่อนไหว';motion.setAttribute('aria-pressed',String(!playing))}motion.onclick=()=>{playing=!playing;sync()};
const modal=document.querySelector('#modal'),content=document.querySelector('#content'),close=document.querySelector('#close');let opener=null,photoURL=null,photoData=null;const wishes=['ขอให้ปีนี้ได้เริ่มต้นสิ่งที่ฝันไว้\nและมีความกล้าพอที่จะเป็นตัวเอง ✨','ขอให้พบความสุขในวันธรรมดา\nมีรอยยิ้มเล็ก ๆ ให้เก็บได้ทุกวัน 🌷','ขอให้มีคนรักเธออย่างอ่อนโยน\nและอย่าลืมรักตัวเองด้วยนะ 🤍'];
function openGift(id,button){opener=button;content.replaceChildren(document.querySelector('#'+id).content.cloneNode(true));modal.hidden=false;document.querySelector('.card').focus();if(id==='wish'){content.querySelectorAll('.fortune').forEach(b=>b.onclick=()=>{content.querySelectorAll('.fortune').forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen');content.querySelector('#fortuneText').textContent=wishes[+b.dataset.card]})}if(id==='memory'){const img=content.querySelector('#photo');if(photoData)img.src=photoData;else{const c=document.createElement('canvas');c.width=600;c.height=400;const g=c.getContext('2d');g.fillStyle='#150b20';g.fillRect(0,0,600,400);g.fillStyle='#dcb0ec';g.font='95px Georgia';g.textAlign='center';g.fillText('♡',300,205);g.font='18px Georgia';g.fillText('Our little memories',300,265);img.src=c.toDataURL()}content.querySelector('#photoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return;if(photoURL)URL.revokeObjectURL(photoURL);photoURL=URL.createObjectURL(f);photoData=photoURL;img.src=photoURL;img.alt='ภาพความทรงจำที่เลือกจากเครื่อง'}}}
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openGift(b.dataset.open,b));function dismiss(){modal.hidden=true;opener?.focus()}close.onclick=dismiss;modal.onclick=e=>{if(e.target===modal)dismiss()};document.addEventListener('keydown',e=>{if(modal.hidden)return;if(e.key==='Escape')dismiss();if(e.key==='Tab'){const f=[...modal.querySelectorAll('button,input')],first=f[0],last=f[f.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement.classList.contains('card'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});addEventListener('resize',size);sync();size();requestAnimationFrame(frame);
</script></body></html>
